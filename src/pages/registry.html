<!doctype html>
<html lang="pt">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contactos</title>

    <link rel="shortcut icon" href="../assets/logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/bootstrap-5.3.3.min.css">
    <link rel="stylesheet" href="../fontawesome-free-6.7.2-web/css/all.css">
    <link rel="stylesheet" href="../styles/login-registry.css">
</head>

<body>
    <main>
        <form action="../index.html" class="mx-auto bg-white">
            <h4 class="text-center fs-3">Registo</h4>

            <fieldset>
                <div class="mb-2 mt-2">
                    <label for="name" class="form-label fw-bold">Nome</label>
                    <input type="text" maxlength="50" class="form-control" id="name">
                </div>
            </fieldset>

            <fieldset>
                <div class="mb-2 mt-3">
                    <label for="email" class="form-label fw-bold">Email</label>
                    <input type="email" maxlength="320" class="form-control" id="email">
                </div>

                <div class="mb-2 mt-3">
                    <label for="password" class="form-label fw-bold">Palavra-passe</label>
                    <input type="password" class="form-control" id="password">
                </div>
            </fieldset>

            <button type="submit" class="btn btn-primary mt-4 w-100 rounded-5 border-0">Registo</button>

            <div class="or-container align-items-center d-flex mt-3 mb-3">
                <div class="line-separator"></div>
                <div class="or-label text-center ms-2 me-2">OU</div>
                <div class="line-separator"></div>
            </div>

            <div class="text-center">
                <a class="btn btn-lg btn-login" href="#">
                    <img class="me-2" src="../assets/google-logo.png">Registo com Google
                </a>

                <br>

                <a class="btn btn-lg btn-login mt-3" href="#">
                    <img class="me-2" src="../assets/facebook-logo.png">Registo com Facebook
                </a>
            </div>

            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none">Já tem conta? Faça login!</a>
            </div>
        </form>
    </main>

    <script src="../js/jquery-3.7.1.min.js" type="text/javascript"></script>
    <script src="../js/bootstrap-5.3.3.bundle.min.js"></script>
</body>

</html>
